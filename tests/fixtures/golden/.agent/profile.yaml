seed_version: 1.5.0
project:
  name: golden
  type: web
  domain: web-app
stack:
  language: typescript
  framework: none
  package_manager: npm
  lockfile: package-lock.json
agent:
  platform: claude-code
  rules_scope: core+type+concern
  maintenance_cadence: weekly
  maintenance_mode: hook
  maintenance_stale_days: 7
  isolation_level: auto
  isolation_egress: deny
delivery:
  vcs: git
  repo_host: github
  branch_strategy: feature-branch
  trunk_branch: main
quality:
  format: prettier
  lint: eslint
verify:
  build: "true"
  test: "true"
  format: npm run format:check
  lint: npm run lint
  outdated: npm outdated
  audit: npm audit --audit-level=high
