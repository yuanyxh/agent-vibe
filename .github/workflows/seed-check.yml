name: seed-check

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check format
        run: ./scripts/check-format.sh
      - name: Shell syntax
        run: |
          for file in scripts/*.sh .githooks/* seeds/scaffolds/hooks/*; do
            bash -n "$file"
          done
      - name: Check whitespace in HEAD
        run: git show --check --format= HEAD
      - name: Verify seeds
        run: ./scripts/verify-seeds.sh --strict
      - name: Verify golden instantiation
        run: ./scripts/test-fixtures.sh
